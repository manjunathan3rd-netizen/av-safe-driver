version: '3.8'

services:
  api:
    build: .
    container_name: av_safe_drive_api
    ports:
      - "8000:8000"
    restart: unless-stopped

  web_preview:
    image: nginx:alpine
    container_name: av_safe_drive_web
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped
